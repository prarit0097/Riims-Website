# ============================================================================
# RIIMS — redirect-only server block for the alternate/brand domains
# (riimshospitals.in, riims.info, riims.co.in, riims.in, kidneyhealer.in,
# kidneyhealer.com, + all their www) on the EXISTING host nginx that already
# serves riimshospitals.com (see nginx-riims-bootstrap.conf) and ~13 other
# unrelated sites on this VPS.
#
# These domains never serve site content themselves — every request 301s
# straight to the canonical domain, https://riimshospitals.com, preserving
# the full path + query string. This keeps all SEO signal (backlinks,
# indexing, rankings) on ONE domain instead of splitting it across many,
# while every domain still "works" for a visitor who types it directly —
# they land on the real site after one instant, invisible redirect.
#
# Install (run on the VPS as root) — first time, no cert exists yet:
#   cd /opt/riims && git pull
#   cp deploy/nginx-riims-redirect-domains.conf /etc/nginx/sites-available/riims-redirects
#   ln -sf /etc/nginx/sites-available/riims-redirects /etc/nginx/sites-enabled/riims-redirects
#   nginx -t && systemctl reload nginx     # nginx -t MUST pass first — protects the other sites
#   certbot --nginx \
#     -d riimshospitals.in -d www.riimshospitals.in \
#     -d riims.info -d www.riims.info \
#     -d riims.co.in -d www.riims.co.in \
#     -d riims.in -d www.riims.in \
#     -d kidneyhealer.in -d www.kidneyhealer.in \
#     -d kidneyhealer.com -d www.kidneyhealer.com \
#     --redirect --agree-tos -m praritsidana786@gmail.com --non-interactive
#   nginx -t && systemctl reload nginx
#
# Adding MORE domains later (cert for riimshospitals.in already exists) — add
# the new names to server_name below, then re-run certbot with --expand and
# the FULL current domain list (old + new) so it grows the same certificate:
#   certbot --nginx --expand \
#     -d riimshospitals.in -d www.riimshospitals.in \
#     -d riims.info -d www.riims.info \
#     -d riims.co.in -d www.riims.co.in \
#     -d riims.in -d www.riims.in \
#     -d kidneyhealer.in -d www.kidneyhealer.in \
#     -d kidneyhealer.com -d www.kidneyhealer.com \
#     -d <new domain> -d www.<new domain> \
#     --redirect --agree-tos -m praritsidana786@gmail.com --non-interactive
#   nginx -t && systemctl reload nginx
#
# Verify:
#   for d in riimshospitals.in www.riimshospitals.in riims.info www.riims.info \
#            riims.co.in www.riims.co.in riims.in www.riims.in \
#            kidneyhealer.in www.kidneyhealer.in kidneyhealer.com www.kidneyhealer.com; do
#     printf "%-25s %s\n" "$d" "$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' http://$d/conditions/ckd.html)"
#   done
# Each line should show a 301 landing on https://riimshospitals.com/conditions/ckd.html
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name riimshospitals.in www.riimshospitals.in
                riims.info www.riims.info
                riims.co.in www.riims.co.in
                riims.in www.riims.in
                kidneyhealer.in www.kidneyhealer.in
                kidneyhealer.com www.kidneyhealer.com;

    return 301 https://riimshospitals.com$request_uri;
}
